name: Release

# Publishes with npm trusted publishing (OIDC): no npm token is stored.
# Before this can publish, each package needs a first manual publish and a
# Trusted Publisher entry on npmjs.com pointing at this repo and this file.
# See CONTRIBUTING.md > Releasing.

on:
  push:
    branches: [main]
  # Lets a maintainer start a fresh run from the Actions tab
  # (re-running an old run keeps its original settings).
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "Release packages"
          commit: "Release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
